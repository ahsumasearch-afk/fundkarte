<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fundkarte</title>
<meta name="description" content="Eigene interaktive Karte mit Markern, Kategorien und gespeichertem Fortschritt.">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#efe9db" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121816'/%3E%3Cpath d='M16 27s9-8 9-14.5a9 9 0 0 0-18 0C7 19 16 27 16 27z' fill='%23e09a4f'/%3E%3Ccircle cx='16' cy='12.5' r='3.2' fill='%23121816'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #121816;
  --surface: #1a2320;
  --surface-2: #243029;
  --line: #36443d;
  --text: #ece7da;
  --muted: #a7aea5;
  --accent: #e09a4f;
  --accent-ink: #1c1309;
  --danger: #ec7f6e;
  --paper: #1f2a25;
  --grid: rgba(236, 231, 218, .07);
  --shadow: 0 10px 30px rgba(0, 0, 0, .38);
  --weich: .35s cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #efe9db;
    --surface: #fbf8f0;
    --surface-2: #f0eadc;
    --line: #d7cebb;
    --text: #23291f;
    --muted: #5d6358;
    --accent: #a8541a;
    --accent-ink: #fff;
    --danger: #b53a2a;
    --paper: #f6f1e4;
    --grid: rgba(35, 41, 31, .09);
    --shadow: 0 10px 28px rgba(60, 48, 25, .2);
    color-scheme: light;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100vh; height: 100dvh; }

.side {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
  padding: 18px 16px 14px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  z-index: 30;
}
.side__head { display: flex; align-items: center; justify-content: space-between; }
.side .side__close { display: none; }
.side__foot { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.side__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.side__note { margin: 0; color: var(--muted); font-size: 12.5px; }

.brand { display: flex; align-items: center; gap: 9px; margin: 0; font: 600 22px/1.1 ui-serif, Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
.brand svg { color: var(--accent); width: 23px; height: 23px; }

.total__row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
.total__row strong { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }

.bar { display: block; height: 6px; overflow: hidden; background: var(--surface-2); border-radius: 3px; }
.bar__value { display: block; height: 100%; width: 0; background: var(--c, var(--accent)); border-radius: 3px; transition: width var(--weich); }

.search { display: flex; align-items: center; gap: 8px; padding: 0 11px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; color: var(--muted); transition: border-color var(--weich); }
.search:hover, .search:focus-within { border-color: var(--accent); }
.search__input { width: 100%; min-width: 0; height: 40px; background: none; border: 0; outline: 0; color: var(--text); font-size: 16px; }

.switches { display: grid; gap: 5px; }
.switch { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; }
.switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.list__head { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; color: var(--muted); font-size: 12.5px; }
.list__title { margin-right: auto; }
.list__empty { margin: 10px 2px; color: var(--muted); font-size: 14px; }

.link { padding: 3px 6px; background: none; border: 0; border-radius: 5px; color: var(--muted); font-size: 12.5px; transition: color var(--weich), background-color var(--weich); }
.link:hover { color: var(--text); background: var(--surface-2); }

.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; padding: 6px 4px 7px 6px; border-radius: 8px; transition: background-color var(--weich); }
.cat:hover { background: var(--surface-2); }
.cat__toggle { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
.cat__toggle input { width: 15px; height: 15px; margin: 0; flex: none; accent-color: var(--c); }
.cat__name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cat__num { margin-left: auto; padding-left: 6px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat .bar { grid-column: 1 / -1; height: 3px; margin-top: 5px; }
.cat.is-off .cat__name, .cat.is-off .cat__num { opacity: .5; }

.hit { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; background: none; border: 0; border-radius: 8px; text-align: left; transition: background-color var(--weich); }
.hit:hover { background: var(--surface-2); }
.hit__dot { width: 10px; height: 10px; flex: none; background: var(--c); border-radius: 50%; }
.hit__text { display: grid; min-width: 0; }
.hit__title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hit__cat { color: var(--muted); font-size: 12.5px; }
.hit svg { margin-left: auto; color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 500; transition: background-color var(--weich), border-color var(--weich), color var(--weich), box-shadow var(--weich); }
.btn:hover { border-color: var(--accent); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.btn--danger { color: var(--danger); }
.btn--danger:hover { border-color: var(--danger); }
.btn--on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; background: none; border: 0; border-radius: 7px; color: var(--muted); transition: color var(--weich), background-color var(--weich); }
.icon:hover { color: var(--text); background: var(--line); }

.map { position: relative; min-width: 0; overflow: hidden; background: var(--paper); }
.map.is-drop::after { content: ""; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px; pointer-events: none; z-index: 40; }

.viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.viewport.is-dragging { cursor: grabbing; }
.viewport.is-placing { cursor: crosshair; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; box-shadow: 0 0 0 1px var(--line); }
.stage--blank {
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px;
}
.stage__image { display: block; width: 100%; height: 100%; pointer-events: none; }
.pins { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

.pin { position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; background: none; border: 0; border-radius: 50%; pointer-events: auto; cursor: pointer; }
.viewport.is-placing .pin { cursor: crosshair; }
.pin__dot { position: relative; display: grid; place-items: center; width: 21px; height: 21px; background: var(--c); border: 2px solid #fff; border-radius: 50%; color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); transition: transform var(--weich), box-shadow var(--weich), opacity var(--weich); }
.pin__dot svg:first-child { display: none; width: 12px; height: 12px; stroke-width: 3; }
.pin:hover .pin__dot { transform: scale(1.22); }
.pin.is-found .pin__dot { background: #39423d; border-color: var(--c); opacity: .82; }
.pin.is-found .pin__dot svg:first-child { display: block; }
.pin.is-selected .pin__dot { transform: scale(1.25); box-shadow: 0 0 0 3px var(--accent), 0 3px 10px rgba(0, 0, 0, .6); opacity: 1; }
.pin__star { position: absolute; right: -6px; top: -6px; display: none; width: 13px; height: 13px; fill: #ffd76a; stroke: #3a2c05; stroke-width: 2; }
.pin.is-fav .pin__star { display: block; }

.tools { position: absolute; left: 14px; top: 14px; display: grid; gap: 8px; z-index: 10; }
.tools__group { display: grid; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
.tools__group .icon { width: 40px; height: 40px; border-radius: 0; color: var(--text); }
.tools__group .icon + .icon { border-top: 1px solid var(--line); }
.tools__menu { display: none; }
.add { position: absolute; left: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10; box-shadow: var(--shadow); }

.banner { position: absolute; left: 50%; top: 14px; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 28px); padding: 6px 7px 6px 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; box-shadow: var(--shadow); transform: translateX(-50%); z-index: 15; }
.banner .btn { min-height: 32px; padding: 3px 10px; }

.panel { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 11px; width: 340px; max-height: calc(100% - 28px); overflow-y: auto; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 20; }
.panel__head { display: flex; align-items: center; gap: 8px; }
.panel__cat { display: flex; align-items: center; gap: 7px; margin-right: auto; color: var(--muted); font-size: 13px; }
.panel__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
.panel__row--tools { grid-template-columns: 1fr 1fr; }
.panel__pos { margin: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field__input { width: 100%; min-height: 38px; padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 16px; transition: border-color var(--weich); }
.field__input:hover, .field__input:focus { border-color: var(--accent); outline: 0; }
textarea.field__input { min-height: 74px; resize: vertical; }
.field__color { width: 56px; height: 36px; padding: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; transition: border-color var(--weich); }
.field__color:hover { border-color: var(--accent); }

.start { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: var(--paper); z-index: 25; }
.start__card { display: grid; gap: 14px; width: min(100%, 440px); padding: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.start__title { margin: 0; font: 600 27px/1.15 ui-serif, Georgia, "Times New Roman", serif; }
.start__text { margin: 0; color: var(--muted); }
.start__note { margin: 0; padding: 9px 11px; background: var(--surface-2); border-radius: 8px; font-size: 14px; }
.start__actions { display: grid; gap: 8px; }

.dialog { width: min(calc(100vw - 32px), 420px); padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); color: var(--text); }
.dialog::backdrop { background: rgba(8, 12, 10, .6); }
.dialog__form { display: grid; gap: 13px; padding: 20px; }
.dialog__title { margin: 0; font: 600 20px/1.2 ui-serif, Georgia, "Times New Roman", serif; }
.dialog__text { margin: 0; color: var(--muted); }
.dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); padding: 9px 14px; background: var(--text); border-radius: 9px; color: var(--bg); font-size: 14px; box-shadow: var(--shadow); transform: translateX(-50%); z-index: 60; }

.scrim { display: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(88vw, 340px); padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); transform: translateX(-105%); visibility: hidden; transition: transform var(--weich), visibility var(--weich); }
  .side.is-open { transform: none; visibility: visible; }
  .side .side__close { display: inline-grid; }
  .scrim { position: fixed; inset: 0; display: block; background: rgba(8, 12, 10, .5); z-index: 29; }
  .tools { top: calc(12px + env(safe-area-inset-top)); left: 12px; }
  .tools__menu { display: inline-grid; }
  .add { left: auto; right: 14px; }
  .banner { top: calc(12px + env(safe-area-inset-top)); left: 64px; max-width: calc(100% - 76px); transform: none; font-size: 14px; }
  .panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 62%; padding-bottom: calc(14px + env(safe-area-inset-bottom)); border-width: 1px 0 0; border-radius: 14px 14px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Filter und Fortschritt">
    <header class="side__head">
      <h1 class="brand"><i data-icon="pin"></i>Fundkarte</h1>
      <button class="icon side__close" id="sideClose" type="button" aria-label="Menü schließen"><i data-icon="close"></i></button>
    </header>
    <section class="total" aria-label="Gesamtfortschritt">
      <div class="total__row"><span>Gefunden</span><strong id="totalNum">0 / 0</strong></div>
      <span class="bar"><span class="bar__value" id="totalBar"></span></span>
    </section>
    <label class="search">
      <i data-icon="search"></i>
      <input class="search__input" id="search" type="search" placeholder="Orte suchen" aria-label="Orte suchen" autocomplete="off">
    </label>
    <div class="switches">
      <label class="switch"><input type="checkbox" id="hideFound">Gefundene ausblenden</label>
      <label class="switch"><input type="checkbox" id="favOnly">Nur Favoriten</label>
    </div>
    <div class="list" id="list"></div>
    <footer class="side__foot">
      <div class="side__actions">
        <button class="btn" id="backupBtn" type="button"><i data-icon="save"></i>Sichern</button>
        <button class="btn" id="importBtn" type="button"><i data-icon="load"></i>Einspielen</button>
        <button class="btn" id="imageBtn" type="button"><i data-icon="image"></i>Kartenbild</button>
        <button class="btn" id="resetBtn" type="button"><i data-icon="reset"></i>Zurücksetzen</button>
      </div>
      <p class="side__note" id="backupNote"></p>
    </footer>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="map" id="map">
    <div class="viewport" id="viewport">
      <div class="stage" id="stage"><img class="stage__image" id="mapImage" alt="Kartenbild" draggable="false" hidden></div>
      <div class="pins" id="pins"></div>
    </div>

    <div class="tools">
      <div class="tools__group tools__menu"><button class="icon" id="menuBtn" type="button" aria-label="Menü öffnen"><i data-icon="menu"></i></button></div>
      <div class="tools__group">
        <button class="icon" id="zoomIn" type="button" aria-label="Hineinzoomen" title="Hineinzoomen (+)"><i data-icon="plus"></i></button>
        <button class="icon" id="zoomOut" type="button" aria-label="Herauszoomen" title="Herauszoomen (−)"><i data-icon="minus"></i></button>
        <button class="icon" id="zoomFit" type="button" aria-label="Ganze Karte zeigen" title="Ganze Karte zeigen (0)"><i data-icon="fit"></i></button>
        <button class="icon" id="fullBtn" type="button" aria-label="Vollbild" title="Vollbild"><i data-icon="full"></i></button>
      </div>
    </div>

    <button class="btn btn--primary add" id="addBtn" type="button" title="Ort setzen (N)"><i data-icon="plus"></i>Ort setzen</button>
    <div class="banner" id="banner" role="status" hidden><span id="bannerText"></span><button class="btn" id="bannerCancel" type="button">Abbrechen</button></div>
    <section class="panel" id="panel" aria-label="Ort bearbeiten" hidden></section>

    <section class="start" id="start" hidden>
      <div class="start__card">
        <h2 class="start__title">Richte deine Karte ein</h2>
        <p class="start__text">Lade ein Kartenbild und setze deine eigenen Orte. Bild und Fortschritt bleiben in diesem Browser.</p>
        <p class="start__note" id="startNote" hidden></p>
        <div class="start__actions">
          <button class="btn btn--primary" id="startImage" type="button"><i data-icon="image"></i>Kartenbild wählen</button>
          <button class="btn" id="startBlank" type="button">Ohne Bild starten</button>
          <button class="btn" id="startImport" type="button"><i data-icon="load"></i>Sicherung einspielen</button>
        </div>
      </div>
    </section>
  </main>
</div>

<input id="file" type="file" hidden>
<dialog class="dialog" id="dialog"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'fundkarte.v1';
  const BLANK = { w: 2400, h: 2400, blank: true };
  const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/webp'];
  const MAX_IMAGE = 80 * 1024 * 1024;
  const PALETTE = ['#e09a4f', '#4fae9b', '#d96c6c', '#7f9fe0', '#c78ad6', '#a9b04c', '#55b5d6', '#e07fa8'];
  const DEFAULT_CATEGORIES = ['Sammelobjekte', 'Verstecke', 'Läden', 'Aktivitäten', 'Aufträge', 'Sonstiges'];
  const ICONS = {
    menu: 'M4 7h16M4 12h16M4 17h16',
    close: 'M6 6l12 12M18 6L6 18',
    plus: 'M12 5v14M5 12h14',
    minus: 'M5 12h14',
    fit: 'M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
    full: 'M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5',
    arrow: 'M5 12h14M13 6l6 6-6 6',
    edit: 'M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4',
    star: 'M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z',
    check: 'M5 12.5l4.5 4.5L19 7.5',
    search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM16 16l5 5',
    pin: 'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
    move: 'M12 3v18M3 12h18M12 3L9 6M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3',
    trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5',
    save: 'M12 4v11M7 11l5 5 5-5M5 20h14',
    load: 'M12 16V5M7 9l5-5 5 5M5 20h14',
    image: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9.5h.01',
    reset: 'M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5'
  };

  const $ = id => document.getElementById(id);
  const ui = {
    side: $('side'), scrim: $('scrim'), list: $('list'), search: $('search'),
    totalNum: $('totalNum'), totalBar: $('totalBar'), hideFound: $('hideFound'), favOnly: $('favOnly'),
    backupNote: $('backupNote'), map: $('map'), viewport: $('viewport'), stage: $('stage'),
    image: $('mapImage'), pins: $('pins'), panel: $('panel'), banner: $('banner'), bannerText: $('bannerText'),
    start: $('start'), startNote: $('startNote'), file: $('file'), dialog: $('dialog'), toast: $('toast')
  };

  let selectedId = null;
  let mode = null;
  let lastCat = null;
  let imageBlob = null;
  let imageUrl = null;
  let dirty = false;
  let storageOk = true;
  let saveTimer = 0;
  let viewTimer = 0;
  let toastTimer = 0;
  let animFrame = 0;
  let renderPending = false;
  let vw = 1;
  let vh = 1;
  const view = { x: 0, y: 0, k: 1 };
  const pinEls = new Map();
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const uid = () => crypto.randomUUID ? crypto.randomUUID() : `m${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
  const text = (value, max) => String(value ?? '').slice(0, max);
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const worldW = () => state.map?.w || BLANK.w;
  const worldH = () => state.map?.h || BLANK.h;
  const catById = id => state.categories.find(c => c.id === id) || state.categories[0];
  const selected = () => state.markers.find(m => m.id === selectedId) || null;
  const isTyping = el => el && (el.matches('input, textarea, select') || el.isContentEditable);
  let state = loadState();

  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null || value === false) continue;
      if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key === 'class') el.className = value;
      else if (key === 'style') el.style.cssText = value;
      else if (key in el && !key.includes('-')) el[key] = value;
      else el.setAttribute(key, value === true ? '' : value);
    }
    el.append(...kids.flat().filter(kid => kid != null && kid !== false));
    return el;
  }

  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'i');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', ICONS[name]);
    svg.append(path);
    return svg;
  }

  /* Speicher */

  function freshState() {
    return {
      version: 1,
      map: null,
      categories: DEFAULT_CATEGORIES.map((name, i) => ({ id: `c${i + 1}`, name, color: PALETTE[i] })),
      markers: [],
      ui: { hidden: [], hideFound: false, favOnly: false, view: null },
      lastBackup: null
    };
  }

  function cleanState(raw) {
    const next = freshState();
    if (!raw || typeof raw !== 'object') return next;
    const catIds = new Set();
    const categories = (Array.isArray(raw.categories) ? raw.categories : []).flatMap(c => {
      const id = text(c?.id, 60);
      const name = text(c?.name, 40).trim();
      if (!id || !name || catIds.has(id)) return [];
      catIds.add(id);
      return [{ id, name, color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[catIds.size % PALETTE.length] }];
    });
    if (categories.length) next.categories = categories;
    else next.categories.forEach(c => catIds.add(c.id));
    const markerIds = new Set();
    next.markers = (Array.isArray(raw.markers) ? raw.markers : []).flatMap(m => {
      const x = Number(m?.x);
      const y = Number(m?.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return [];
      let id = text(m.id, 60);
      if (!id || markerIds.has(id)) id = uid();
      markerIds.add(id);
      return [{
        id,
        cat: catIds.has(m.cat) ? m.cat : next.categories[0].id,
        x: clamp(x, 0, 1),
        y: clamp(y, 0, 1),
        title: text(m.title, 120) || 'Ort',
        note: text(m.note, 4000),
        found: !!m.found,
        fav: !!m.fav
      }];
    });
    if (raw.map && raw.map.w > 0 && raw.map.h > 0) next.map = { w: Number(raw.map.w), h: Number(raw.map.h), blank: !!raw.map.blank };
    const rawUi = raw.ui || {};
    next.ui.hidden = (Array.isArray(rawUi.hidden) ? rawUi.hidden : []).filter(id => catIds.has(id));
    next.ui.hideFound = !!rawUi.hideFound;
    next.ui.favOnly = !!rawUi.favOnly;
    const v = rawUi.view;
    if (v && [v.cx, v.cy, v.z].every(Number.isFinite)) next.ui.view = { cx: v.cx, cy: v.cy, z: v.z };
    next.lastBackup = typeof raw.lastBackup === 'string' ? raw.lastBackup : null;
    return next;
  }

  function loadState() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
      return cleanState(JSON.parse(raw));
    } catch {
      try {
        if (raw) localStorage.setItem(`${STORE_KEY}.defekt`, raw);
      } catch { /* ohne Speicher bleibt nur der frische Stand */ }
      return freshState();
    }
  }

  function save() {
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 150);
  }

  function flush() {
    clearTimeout(saveTimer);
    if (!dirty) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      dirty = false;
      storageOk = true;
    } catch {
      if (storageOk) toast('Speichern ging nicht. Bitte lade eine Sicherung herunter.');
      storageOk = false;
    }
  }

  function openFiles() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('fundkarte', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('files');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function fileStore(run, access = 'readonly') {
    const db = await openFiles();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('files', access);
        const request = run(tx.objectStore('files'));
        tx.oncomplete = () => resolve(request.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    } finally {
      db.close();
    }
  }

  /* Karte und Ansicht */

  const fitScale = () => Math.min(vw / worldW(), vh / worldH()) * .96;
  const minScale = () => fitScale() * .7;
  const maxScale = () => Math.max(fitScale() * 14, 3);

  function bounded(x, y, k) {
    const scale = clamp(k, minScale(), maxScale());
    return {
      x: clamp(x, vw * .25 - worldW() * scale, vw * .75),
      y: clamp(y, vh * .25 - worldH() * scale, vh * .75),
      k: scale
    };
  }

  function setView(x, y, k) {
    Object.assign(view, bounded(x, y, k));
    scheduleRender();
    clearTimeout(viewTimer);
    viewTimer = setTimeout(rememberView, 400);
  }

  function rememberView() {
    state.ui.view = {
      cx: (vw / 2 - view.x) / (view.k * worldW()),
      cy: (vh / 2 - view.y) / (view.k * worldH()),
      z: view.k / fitScale()
    };
    save();
  }

  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => {
      renderPending = false;
      ui.stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
      positionPins();
    });
  }

  function animateTo(x, y, k, ms = 380) {
    cancelAnimationFrame(animFrame);
    const target = bounded(x, y, k);
    if (reducedMotion.matches || document.hidden) {
      setView(target.x, target.y, target.k);
      return;
    }
    const from = { ...view };
    const started = performance.now();
    const step = now => {
      const progress = Math.min(1, (now - started) / ms);
      const eased = 1 - (1 - progress) ** 3;
      setView(
        from.x + (target.x - from.x) * eased,
        from.y + (target.y - from.y) * eased,
        from.k * (target.k / from.k) ** eased
      );
      if (progress < 1) animFrame = requestAnimationFrame(step);
    };
    animFrame = requestAnimationFrame(step);
  }

  function zoomAt(px, py, factor, animated) {
    const k = clamp(view.k * factor, minScale(), maxScale());
    const x = px - (px - view.x) * (k / view.k);
    const y = py - (py - view.y) * (k / view.k);
    if (animated) animateTo(x, y, k, 300);
    else setView(x, y, k);
  }

  function fitMap(animated) {
    const k = fitScale();
    const x = (vw - worldW() * k) / 2;
    const y = (vh - worldH() * k) / 2;
    if (animated) animateTo(x, y, k);
    else setView(x, y, k);
  }

  function focusOffset() {
    if (ui.panel.hidden) return { x: 0, y: 0 };
    if (matchMedia('(max-width: 820px)').matches) return { x: 0, y: -ui.panel.offsetHeight / 2 };
    return { x: -(ui.panel.offsetWidth + 14) / 2, y: 0 };
  }

  function flyToMarker(m) {
    const k = Math.max(view.k, Math.min(fitScale() * 3, maxScale()));
    const offset = focusOffset();
    animateTo(vw / 2 + offset.x - m.x * worldW() * k, vh / 2 + offset.y - m.y * worldH() * k, k);
  }

  function keepVisible(m) {
    const panel = ui.panel.getBoundingClientRect();
    const frame = ui.viewport.getBoundingClientRect();
    const px = m.x * worldW() * view.k + view.x + frame.left;
    const py = m.y * worldH() * view.k + view.y + frame.top;
    if (px < panel.left - 24 || px > panel.right + 24 || py < panel.top - 24 || py > panel.bottom + 24) return;
    const offset = focusOffset();
    animateTo(vw / 2 + offset.x - m.x * worldW() * view.k, vh / 2 + offset.y - m.y * worldH() * view.k, view.k);
  }

  function measure() {
    const rect = ui.viewport.getBoundingClientRect();
    vw = Math.max(1, rect.width);
    vh = Math.max(1, rect.height);
  }

  function enterMap(refit) {
    ui.start.hidden = true;
    ui.stage.style.width = `${worldW()}px`;
    ui.stage.style.height = `${worldH()}px`;
    ui.stage.classList.toggle('stage--blank', !!state.map.blank);
    ui.image.hidden = !!state.map.blank;
    measure();
    const saved = state.ui.view;
    if (!refit && saved) {
      const k = saved.z * fitScale();
      setView(vw / 2 - saved.cx * worldW() * k, vh / 2 - saved.cy * worldH() * k, k);
    } else {
      fitMap(false);
    }
    refresh();
  }

  function showStart() {
    const count = state.markers.length;
    ui.startNote.hidden = !count;
    ui.startNote.textContent = count ? `Deine ${count} Orte sind gespeichert. Lade das Kartenbild erneut, um weiterzumachen.` : '';
    ui.start.hidden = false;
    refresh();
  }

  function probeImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const probe = new Image();
      probe.onload = () => resolve({ url, w: probe.naturalWidth, h: probe.naturalHeight });
      probe.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('image'));
      };
      probe.src = url;
    });
  }

  function showImage(blob, url) {
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageBlob = blob;
    imageUrl = url;
    ui.image.src = url;
  }

  async function useImage(file) {
    if (!IMAGE_TYPES.includes(file.type)) return toast('Bitte ein PNG-, JPG- oder WebP-Bild wählen.');
    if (file.size > MAX_IMAGE) return toast('Das Bild ist größer als 80 MB.');
    let probe;
    try {
      probe = await probeImage(file);
    } catch {
      return toast('Das Bild konnte nicht gelesen werden.');
    }
    showImage(file, probe.url);
    state.map = { w: probe.w, h: probe.h, blank: false };
    state.ui.view = null;
    save();
    flush();
    enterMap(true);
    try {
      await fileStore(store => store.put(file, 'map'), 'readwrite');
      navigator.storage?.persist?.();
    } catch {
      toast('Das Bild konnte nicht dauerhaft gespeichert werden.');
    }
  }

  function startBlank() {
    state.map = { ...BLANK };
    state.ui.view = null;
    save();
    enterMap(true);
  }

  /* Marker */

  function isVisible(m) {
    if (m.id === selectedId) return true;
    if (state.ui.hidden.includes(m.cat)) return false;
    if (state.ui.hideFound && m.found) return false;
    return !(state.ui.favOnly && !m.fav);
  }

  function syncPins() {
    const visible = new Set();
    for (const m of state.markers) {
      if (!isVisible(m)) continue;
      visible.add(m.id);
      let el = pinEls.get(m.id);
      if (!el) {
        const star = icon('star');
        star.setAttribute('class', 'pin__star');
        el = h('button', { class: 'pin', type: 'button', 'data-id': m.id },
          h('span', { class: 'pin__dot' }, icon('check'), star));
        pinEls.set(m.id, el);
        ui.pins.append(el);
      }
      const cat = catById(m.cat);
      el._marker = m;
      el.style.setProperty('--c', cat.color);
      el.title = m.title;
      el.setAttribute('aria-label', `${m.title}, ${cat.name}${m.found ? ', gefunden' : ''}`);
      el.classList.toggle('is-found', m.found);
      el.classList.toggle('is-fav', m.fav);
      el.classList.toggle('is-selected', m.id === selectedId);
    }
    for (const [id, el] of pinEls) {
      if (!visible.has(id)) {
        el.remove();
        pinEls.delete(id);
      }
    }
    positionPins();
  }

  function positionPins() {
    const w = worldW() * view.k;
    const h2 = worldH() * view.k;
    for (const el of pinEls.values()) {
      const px = el._marker.x * w + view.x;
      const py = el._marker.y * h2 + view.y;
      const onScreen = px > -40 && py > -40 && px < vw + 40 && py < vh + 40;
      if (el._onScreen !== onScreen) {
        el.style.display = onScreen ? '' : 'none';
        el._onScreen = onScreen;
      }
      if (onScreen) el.style.transform = `translate(${px - 17}px, ${py - 17}px)`;
    }
  }

  function select(id, fly) {
    selectedId = id;
    const m = selected();
    if (m) lastCat = m.cat;
    refresh();
    renderPanel();
    if (m && fly) flyToMarker(m);
    else if (m) keepVisible(m);
  }

  function setMode(next) {
    mode = next;
    ui.viewport.classList.toggle('is-placing', !!mode);
    ui.banner.hidden = !mode;
    ui.bannerText.textContent = mode === 'move' ? 'Tippe auf die neue Position.' : 'Tippe auf die Karte, um den Ort zu setzen.';
  }

  function placeAt(px, py) {
    const nx = (px - view.x) / (view.k * worldW());
    const ny = (py - view.y) / (view.k * worldH());
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return toast('Diese Stelle liegt außerhalb der Karte.');
    if (mode === 'move') {
      const m = selected();
      if (m) Object.assign(m, { x: nx, y: ny });
      setMode(null);
      save();
      syncPins();
      renderPanel();
      return;
    }
    const visibleCat = state.categories.find(c => c.id === lastCat && !state.ui.hidden.includes(c.id))
      || state.categories.find(c => !state.ui.hidden.includes(c.id))
      || state.categories[0];
    const marker = { id: uid(), cat: visibleCat.id, x: nx, y: ny, title: 'Neuer Ort', note: '', found: false, fav: false };
    state.markers.push(marker);
    state.ui.hidden = state.ui.hidden.filter(id => id !== marker.cat);
    setMode(null);
    save();
    select(marker.id);
    const title = ui.panel.querySelector('[data-title]');
    title?.focus();
    title?.select();
  }

  function toggleFound(m) {
    m.found = !m.found;
    save();
    refresh();
    renderPanel();
  }

  function toggleFav(m) {
    m.fav = !m.fav;
    save();
    refresh();
    renderPanel();
  }

  async function removeMarker(m) {
    const answer = await dialog({
      title: 'Ort löschen?',
      text: `„${m.title}“ wird entfernt.`,
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Löschen', value: true, kind: 'danger' }]
    });
    if (!answer) return;
    state.markers = state.markers.filter(item => item.id !== m.id);
    selectedId = null;
    setMode(null);
    save();
    refresh();
    renderPanel();
  }

  function nextOpen(cat) {
    const inCat = state.markers.filter(m => m.cat === cat.id);
    const open = inCat.filter(m => !m.found);
    if (!inCat.length) return toast(`In „${cat.name}“ gibt es noch keine Orte.`);
    if (!open.length) return toast(`In „${cat.name}“ ist alles gefunden.`);
    const current = inCat.findIndex(m => m.id === selectedId);
    const next = inCat.slice(current + 1).find(m => !m.found) || open[0];
    state.ui.hidden = state.ui.hidden.filter(id => id !== cat.id);
    save();
    closeSide();
    select(next.id, true);
  }

  /* Oberfläche */

  function refresh() {
    renderTotals();
    renderList();
    syncPins();
    ui.hideFound.checked = state.ui.hideFound;
    ui.favOnly.checked = state.ui.favOnly;
    ui.backupNote.textContent = state.lastBackup
      ? `Zuletzt gesichert: ${new Date(state.lastBackup).toLocaleDateString('de-DE')}`
      : 'Noch keine Sicherung. Browserdaten können verloren gehen.';
  }

  function renderTotals() {
    const total = state.markers.length;
    const found = state.markers.filter(m => m.found).length;
    ui.totalNum.textContent = `${found} / ${total}`;
    ui.totalBar.style.width = total ? `${found / total * 100}%` : '0';
  }

  function renderList() {
    const active = document.activeElement?.dataset?.focus;
    const query = ui.search.value.trim().toLocaleLowerCase('de');
    ui.list.replaceChildren(...(query ? searchRows(query) : categoryRows()));
    if (active) ui.list.querySelector(`[data-focus="${CSS.escape(active)}"]`)?.focus();
  }

  function categoryRows() {
    const head = h('div', { class: 'list__head' },
      h('span', { class: 'list__title' }, 'Kategorien'),
      h('button', { class: 'link', type: 'button', 'data-focus': 'all', onclick: () => setAllCategories(true) }, 'Alle'),
      h('button', { class: 'link', type: 'button', 'data-focus': 'none', onclick: () => setAllCategories(false) }, 'Keine'),
      h('button', { class: 'link', type: 'button', 'data-focus': 'new', onclick: () => editCategory(null) }, 'Neu'));
    const rows = state.categories.map(cat => {
      const items = state.markers.filter(m => m.cat === cat.id);
      const found = items.filter(m => m.found).length;
      const on = !state.ui.hidden.includes(cat.id);
      return h('div', { class: `cat${on ? '' : ' is-off'}`, style: `--c:${cat.color}` },
        h('label', { class: 'cat__toggle' },
          h('input', { type: 'checkbox', checked: on, 'data-focus': `t:${cat.id}`, onchange: e => toggleCategory(cat.id, e.target.checked) }),
          h('span', { class: 'cat__name' }, cat.name),
          h('span', { class: 'cat__num' }, `${found} / ${items.length}`)),
        h('button', { class: 'icon', type: 'button', title: 'Nächster offener Ort', 'aria-label': `Nächster offener Ort in ${cat.name}`, 'data-focus': `n:${cat.id}`, onclick: () => nextOpen(cat) }, icon('arrow')),
        h('button', { class: 'icon', type: 'button', title: 'Bearbeiten', 'aria-label': `${cat.name} bearbeiten`, 'data-focus': `e:${cat.id}`, onclick: () => editCategory(cat) }, icon('edit')),
        h('span', { class: 'bar' }, h('span', { class: 'bar__value', style: `width:${items.length ? found / items.length * 100 : 0}%` })));
    });
    return [head, ...rows];
  }

  function searchRows(query) {
    const hits = state.markers.filter(m => `${m.title} ${m.note} ${catById(m.cat).name}`.toLocaleLowerCase('de').includes(query));
    if (!hits.length) return [h('p', { class: 'list__empty' }, 'Keine Treffer.')];
    const rows = hits.slice(0, 60).map(m => {
      const cat = catById(m.cat);
      return h('button', { class: 'hit', type: 'button', style: `--c:${cat.color}`, 'data-focus': `h:${m.id}`, onclick: () => { closeSide(); revealAndSelect(m); } },
        h('span', { class: 'hit__dot' }),
        h('span', { class: 'hit__text' }, h('span', { class: 'hit__title' }, m.title), h('span', { class: 'hit__cat' }, cat.name)),
        m.found && icon('check'));
    });
    if (hits.length > 60) rows.push(h('p', { class: 'list__empty' }, `und ${hits.length - 60} weitere`));
    return rows;
  }

  function revealAndSelect(m) {
    state.ui.hidden = state.ui.hidden.filter(id => id !== m.cat);
    save();
    select(m.id, true);
  }

  function toggleCategory(id, on) {
    state.ui.hidden = on ? state.ui.hidden.filter(item => item !== id) : [...state.ui.hidden, id];
    save();
    refresh();
  }

  function setAllCategories(on) {
    state.ui.hidden = on ? [] : state.categories.map(c => c.id);
    save();
    refresh();
  }

  function field(label, control) {
    return h('label', { class: 'field' }, label, control);
  }

  function renderPanel() {
    const m = selected();
    ui.panel.hidden = !m;
    if (!m) {
      ui.panel.replaceChildren();
      return;
    }
    const cat = catById(m.cat);
    const options = state.categories.map(c => h('option', { value: c.id, selected: c.id === m.cat }, c.name));
    const title = h('input', {
      class: 'field__input', value: m.title, maxLength: 120, 'data-title': true,
      oninput: e => { m.title = e.target.value; save(); syncPins(); },
      onblur: e => {
        if (e.target.value.trim()) return;
        m.title = 'Ort';
        e.target.value = m.title;
        save();
        refresh();
      }
    });
    const select_ = h('select', {
      class: 'field__input',
      onchange: e => { m.cat = e.target.value; lastCat = m.cat; save(); refresh(); renderPanel(); }
    }, options);
    const note = h('textarea', {
      class: 'field__input', value: m.note, maxLength: 4000, placeholder: 'Hinweise zum Fundort',
      oninput: e => { m.note = e.target.value; save(); }
    });
    ui.panel.replaceChildren(
      h('div', { class: 'panel__head' },
        h('span', { class: 'panel__cat' }, h('span', { class: 'hit__dot', style: `--c:${cat.color}` }), cat.name),
        h('button', { class: 'icon', type: 'button', 'aria-label': 'Schließen', onclick: () => { setMode(null); select(null); } }, icon('close'))),
      field('Name', title),
      field('Kategorie', select_),
      field('Notiz', note),
      h('div', { class: 'panel__row' },
        h('button', { class: `btn ${m.found ? 'btn--on' : 'btn--primary'}`, type: 'button', 'aria-pressed': String(m.found), onclick: () => toggleFound(m) }, icon('check'), m.found ? 'Gefunden' : 'Als gefunden markieren'),
        h('button', { class: `btn${m.fav ? ' btn--on' : ''}`, type: 'button', 'aria-label': 'Favorit', 'aria-pressed': String(m.fav), title: 'Favorit', onclick: () => toggleFav(m) }, icon('star'))),
      h('div', { class: 'panel__row panel__row--tools' },
        h('button', { class: 'btn', type: 'button', onclick: () => setMode('move') }, icon('move'), 'Verschieben'),
        h('button', { class: 'btn btn--danger', type: 'button', onclick: () => removeMarker(m) }, icon('trash'), 'Löschen')),
      h('p', { class: 'panel__pos' }, `Position: ${(m.x * 100).toFixed(2)} / ${(m.y * 100).toFixed(2)} %`));
  }

  function dialog({ title, text: body, content = [], actions, focus }) {
    return new Promise(resolve => {
      const finish = value => {
        ui.dialog.removeEventListener('cancel', onCancel);
        ui.dialog.close();
        resolve(value);
      };
      const onCancel = e => {
        e.preventDefault();
        finish(null);
      };
      ui.dialog.addEventListener('cancel', onCancel);
      const primary = actions.find(a => a.kind === 'primary');
      ui.dialog.replaceChildren(h('form', {
        class: 'dialog__form',
        onsubmit: e => {
          e.preventDefault();
          if (primary) finish(primary.value);
        }
      },
      h('h2', { class: 'dialog__title' }, title),
      body && h('p', { class: 'dialog__text' }, body),
      content,
      h('div', { class: 'dialog__actions' }, actions.map(a => h('button', {
        class: `btn${a.kind ? ` btn--${a.kind}` : ''}`,
        type: a.kind === 'primary' ? 'submit' : 'button',
        onclick: a.kind === 'primary' ? null : () => finish(a.value)
      }, a.label)))));
      ui.dialog.showModal();
      if (focus) {
        focus.focus();
        focus.select?.();
      }
    });
  }

  async function editCategory(cat) {
    const name = h('input', { class: 'field__input', value: cat?.name || '', maxLength: 40 });
    const color = h('input', { class: 'field__color', type: 'color', value: cat?.color || PALETTE[state.categories.length % PALETTE.length] });
    const actions = [{ label: 'Abbrechen', value: null }, { label: 'Speichern', value: 'save', kind: 'primary' }];
    if (cat && state.categories.length > 1) actions.unshift({ label: 'Löschen', value: 'delete', kind: 'danger' });
    const result = await dialog({
      title: cat ? 'Kategorie bearbeiten' : 'Neue Kategorie',
      content: [field('Name', name), field('Farbe', color)],
      actions,
      focus: name
    });
    if (result === 'delete') return removeCategory(cat);
    if (result !== 'save') return;
    const value = name.value.trim();
    if (!value) return toast('Bitte einen Namen eingeben.');
    if (cat) Object.assign(cat, { name: value, color: color.value });
    else state.categories.push({ id: uid(), name: value, color: color.value });
    save();
    refresh();
    renderPanel();
  }

  async function removeCategory(cat) {
    const target = state.categories.find(c => c.id !== cat.id);
    const count = state.markers.filter(m => m.cat === cat.id).length;
    const answer = await dialog({
      title: 'Kategorie löschen?',
      text: count ? `${count} Orte wandern nach „${target.name}“.` : `„${cat.name}“ wird entfernt.`,
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Löschen', value: true, kind: 'danger' }]
    });
    if (!answer) return;
    state.markers.forEach(m => { if (m.cat === cat.id) m.cat = target.id; });
    state.categories = state.categories.filter(c => c.id !== cat.id);
    state.ui.hidden = state.ui.hidden.filter(id => id !== cat.id);
    save();
    refresh();
    renderPanel();
  }

  function toast(message) {
    clearTimeout(toastTimer);
    ui.toast.textContent = message;
    ui.toast.hidden = false;
    toastTimer = setTimeout(() => { ui.toast.hidden = true; }, 3600);
  }

  function openSide() {
    ui.side.classList.add('is-open');
    ui.scrim.hidden = false;
  }

  function closeSide() {
    ui.side.classList.remove('is-open');
    ui.scrim.hidden = true;
  }

  /* Sichern und Einspielen */

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }

  async function backup() {
    const withImage = h('input', { type: 'checkbox' });
    const content = imageBlob ? [h('label', { class: 'switch' }, withImage, 'Kartenbild mitsichern (größere Datei)')] : [];
    const answer = await dialog({
      title: 'Sicherung herunterladen',
      text: 'Die Datei enthält deine Orte, Notizen und deinen Fortschritt. Auf einem anderen Gerät spielst du sie über „Einspielen“ ein.',
      content,
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Herunterladen', value: true, kind: 'primary' }]
    });
    if (!answer) return;
    state.lastBackup = new Date().toISOString();
    const data = { app: 'fundkarte', version: 1, exportedAt: state.lastBackup, state };
    try {
      if (withImage.checked && imageBlob) data.image = await blobToDataUrl(imageBlob);
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const link = h('a', { href: url, download: `fundkarte-sicherung-${state.lastBackup.slice(0, 10)}.json` });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      save();
      refresh();
      toast('Sicherung erstellt.');
    } catch {
      toast('Die Sicherung konnte nicht erstellt werden.');
    }
  }

  async function restore(data) {
    const answer = await dialog({
      title: 'Sicherung einspielen?',
      text: `Dein aktueller Stand mit ${state.markers.length} Orten wird ersetzt.`,
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Ersetzen', value: true, kind: 'primary' }]
    });
    if (!answer) return;
    const next = cleanState(data.state);
    let blob = null;
    if (typeof data.image === 'string' && /^data:image\/(png|jpeg|webp);base64,/.test(data.image)) {
      try {
        blob = await (await fetch(data.image)).blob();
      } catch {
        toast('Das Kartenbild in der Sicherung ist beschädigt.');
      }
    }
    state = next;
    selectedId = null;
    setMode(null);
    renderPanel();
    save();
    if (blob) {
      await useImage(blob);
    } else if (state.map?.blank) {
      enterMap(true);
    } else if (imageBlob) {
      const probe = await probeImage(imageBlob);
      URL.revokeObjectURL(probe.url);
      state.map = { w: probe.w, h: probe.h, blank: false };
      save();
      enterMap(true);
    } else {
      state.map = null;
      save();
      showStart();
    }
    flush();
    toast('Sicherung eingespielt.');
  }

  function parseCsv(source) {
    const clean = source.replace(/^﻿/, '');
    const firstLine = clean.split(/\r?\n/, 1)[0];
    const delimiter = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [];
    let cell = '';
    let quoted = false;
    for (let i = 0; i < clean.length; i++) {
      const char = clean[i];
      if (quoted) {
        if (char === '"' && clean[i + 1] === '"') { cell += '"'; i++; }
        else if (char === '"') quoted = false;
        else cell += char;
      } else if (char === '"') {
        quoted = true;
      } else if (char === delimiter) {
        row.push(cell);
        cell = '';
      } else if (char === '\n') {
        row.push(cell.replace(/\r$/, ''));
        rows.push(row);
        row = [];
        cell = '';
      } else {
        cell += char;
      }
    }
    if (cell || row.length) rows.push([...row, cell]);
    const header = (rows.shift() || []).map(name => name.trim().toLowerCase());
    return rows.filter(r => r.some(value => value.trim())).map(r => Object.fromEntries(header.map((name, i) => [name, r[i]])));
  }

  function importMarkers(rows) {
    const byName = new Map(state.categories.map(c => [c.name.toLocaleLowerCase('de'), c]));
    const seen = new Set(state.markers.map(m => `${m.title}|${m.x.toFixed(4)}|${m.y.toFixed(4)}`));
    let added = 0;
    let skipped = 0;
    for (const raw of rows) {
      const r = Object.fromEntries(Object.entries(raw || {}).map(([key, value]) => [key.toLowerCase(), value]));
      const x = Number(String(r.x ?? '').replace(',', '.'));
      const y = Number(String(r.y ?? '').replace(',', '.'));
      const title = text(r.title ?? r.titel ?? r.name, 120).trim();
      if (!title || r.x === '' || r.y === '' || !(x >= 0 && x <= 100) || !(y >= 0 && y <= 100)) {
        skipped++;
        continue;
      }
      const key = `${title}|${(x / 100).toFixed(4)}|${(y / 100).toFixed(4)}`;
      if (seen.has(key)) {
        skipped++;
        continue;
      }
      seen.add(key);
      const catName = text(r.category ?? r.kategorie, 40).trim() || 'Sonstiges';
      let cat = byName.get(catName.toLocaleLowerCase('de'));
      if (!cat) {
        cat = { id: uid(), name: catName, color: PALETTE[state.categories.length % PALETTE.length] };
        state.categories.push(cat);
        byName.set(catName.toLocaleLowerCase('de'), cat);
      }
      const found = r.found ?? r.gefunden;
      state.markers.push({
        id: uid(), cat: cat.id, x: x / 100, y: y / 100, title,
        note: text(r.note ?? r.notiz ?? r.beschreibung, 4000),
        found: found === true || /^(1|ja|true|x)$/i.test(String(found ?? '').trim()),
        fav: false
      });
      added++;
    }
    save();
    refresh();
    toast(`${added} ${added === 1 ? 'Ort' : 'Orte'} importiert${skipped ? `, ${skipped} übersprungen` : ''}.`);
  }

  async function handleFile(file) {
    if (!file) return;
    const name = file.name.toLowerCase();
    if (IMAGE_TYPES.includes(file.type)) return useImage(file);
    const isCsv = name.endsWith('.csv');
    if (!isCsv && !name.endsWith('.json')) return toast('Dieses Dateiformat wird nicht unterstützt.');
    try {
      const source = await file.text();
      if (isCsv) return importMarkers(parseCsv(source));
      const data = JSON.parse(source);
      if (data?.app === 'fundkarte' && data.state) return await restore(data);
      const rows = Array.isArray(data) ? data : data?.markers;
      if (!Array.isArray(rows)) return toast('In der Datei wurden keine Orte gefunden.');
      importMarkers(rows);
    } catch {
      toast('Die Datei konnte nicht gelesen werden.');
    }
  }

  function pickFile(accept) {
    ui.file.accept = accept;
    ui.file.value = '';
    ui.file.click();
  }

  async function resetData() {
    const choice = await dialog({
      title: 'Was soll zurückgesetzt werden?',
      text: 'Lade vorher am besten eine Sicherung herunter.',
      actions: [
        { label: 'Abbrechen', value: null },
        { label: 'Nur Fortschritt', value: 'progress' },
        { label: 'Alles löschen', value: 'all', kind: 'danger' }
      ]
    });
    if (choice === 'progress') {
      state.markers.forEach(m => { m.found = false; });
      save();
      refresh();
      renderPanel();
      return toast('Fortschritt zurückgesetzt.');
    }
    if (choice !== 'all') return;
    const sure = await dialog({
      title: 'Wirklich alles löschen?',
      text: 'Kartenbild, Orte, Kategorien und Fortschritt werden aus diesem Browser entfernt.',
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Endgültig löschen', value: true, kind: 'danger' }]
    });
    if (!sure) return;
    state = freshState();
    selectedId = null;
    setMode(null);
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageBlob = null;
    imageUrl = null;
    ui.image.removeAttribute('src');
    ui.image.hidden = true;
    renderPanel();
    dirty = true;
    flush();
    try {
      await fileStore(store => store.delete('map'), 'readwrite');
    } catch {
      toast('Das Kartenbild konnte nicht gelöscht werden.');
    }
    closeSide();
    showStart();
  }

  /* Eingaben */

  const pointers = new Map();
  let gesture = null;

  const localPoint = e => {
    const rect = ui.viewport.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  function startPinch() {
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    gesture = {
      pinch: true, moved: true,
      dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      wx: (mid.x - view.x) / view.k,
      wy: (mid.y - view.y) / view.k,
      k: view.k
    };
  }

  ui.viewport.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    cancelAnimationFrame(animFrame);
    const point = localPoint(e);
    pointers.set(e.pointerId, point);
    if (pointers.size === 1) {
      gesture = { sx: point.x, sy: point.y, vx: view.x, vy: view.y, moved: false, markerId: e.target.closest('.pin')?.dataset.id || null };
    } else if (pointers.size === 2) {
      startPinch();
    }
  });

  window.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId) || !gesture) return;
    const point = localPoint(e);
    pointers.set(e.pointerId, point);
    if (gesture.pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const k = clamp(gesture.k * Math.hypot(a.x - b.x, a.y - b.y) / gesture.dist, minScale(), maxScale());
      setView((a.x + b.x) / 2 - gesture.wx * k, (a.y + b.y) / 2 - gesture.wy * k, k);
      return;
    }
    const dx = point.x - gesture.sx;
    const dy = point.y - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) < 6) return;
    gesture.moved = true;
    ui.viewport.classList.add('is-dragging');
    setView(gesture.vx + dx, gesture.vy + dy, view.k);
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    const point = localPoint(e);
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      const [rest] = pointers.values();
      gesture = { sx: rest.x, sy: rest.y, vx: view.x, vy: view.y, moved: true, markerId: null };
      return;
    }
    if (pointers.size) return;
    ui.viewport.classList.remove('is-dragging');
    const ended = gesture;
    gesture = null;
    if (!ended || ended.moved || e.type === 'pointercancel') return;
    if (mode) placeAt(point.x, point.y);
    else if (ended.markerId) select(ended.markerId);
    else if (selectedId) select(null);
  }

  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  ui.viewport.addEventListener('click', e => {
    if (e.detail !== 0) return;
    const pin = e.target.closest('.pin');
    if (pin) select(pin.dataset.id);
  });

  ui.viewport.addEventListener('wheel', e => {
    e.preventDefault();
    cancelAnimationFrame(animFrame);
    const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const point = localPoint(e);
    zoomAt(point.x, point.y, Math.exp(-delta * (e.ctrlKey ? .01 : .0016)));
  }, { passive: false });

  ui.viewport.addEventListener('dblclick', e => {
    if (mode || e.target.closest('.pin')) return;
    const point = localPoint(e);
    zoomAt(point.x, point.y, 2, true);
  });

  const zoomCenter = factor => zoomAt(vw / 2, vh / 2, factor, true);
  $('zoomIn').addEventListener('click', () => zoomCenter(1.6));
  $('zoomOut').addEventListener('click', () => zoomCenter(1 / 1.6));
  $('zoomFit').addEventListener('click', () => fitMap(true));

  const fullBtn = $('fullBtn');
  fullBtn.hidden = !document.documentElement.requestFullscreen;
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => toast('Vollbild ist hier nicht möglich.'));
  });

  $('addBtn').addEventListener('click', () => setMode(mode === 'add' ? null : 'add'));
  $('bannerCancel').addEventListener('click', () => setMode(null));
  $('menuBtn').addEventListener('click', openSide);
  $('sideClose').addEventListener('click', closeSide);
  ui.scrim.addEventListener('click', closeSide);
  $('backupBtn').addEventListener('click', backup);
  $('importBtn').addEventListener('click', () => pickFile('.json,.csv,application/json,text/csv'));
  $('imageBtn').addEventListener('click', () => pickFile(IMAGE_TYPES.join(',')));
  $('resetBtn').addEventListener('click', resetData);
  $('startImage').addEventListener('click', () => pickFile(IMAGE_TYPES.join(',')));
  $('startBlank').addEventListener('click', startBlank);
  $('startImport').addEventListener('click', () => pickFile('.json,application/json'));
  ui.file.addEventListener('change', () => handleFile(ui.file.files[0]));
  ui.search.addEventListener('input', renderList);
  ui.hideFound.addEventListener('change', () => { state.ui.hideFound = ui.hideFound.checked; save(); refresh(); });
  ui.favOnly.addEventListener('change', () => { state.ui.favOnly = ui.favOnly.checked; save(); refresh(); });

  document.addEventListener('keydown', e => {
    if (ui.dialog.open) return;
    if (e.key === 'Escape') {
      if (isTyping(e.target)) e.target.blur();
      else if (mode) setMode(null);
      else if (ui.side.classList.contains('is-open')) closeSide();
      else if (selectedId) select(null);
      return;
    }
    if (isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey || !ui.start.hidden) return;
    const m = selected();
    const step = 90;
    const actions = {
      '+': () => zoomCenter(1.4), '=': () => zoomCenter(1.4), '-': () => zoomCenter(1 / 1.4), '0': () => fitMap(true),
      n: () => setMode('add'), f: () => m && toggleFound(m),
      ArrowLeft: () => setView(view.x + step, view.y, view.k), ArrowRight: () => setView(view.x - step, view.y, view.k),
      ArrowUp: () => setView(view.x, view.y + step, view.k), ArrowDown: () => setView(view.x, view.y - step, view.k)
    };
    const action = actions[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (action) {
      e.preventDefault();
      action();
    }
  });

  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault();
    dragDepth++;
    ui.map.classList.add('is-drop');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) ui.map.classList.remove('is-drop');
  });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    ui.map.classList.remove('is-drop');
    handleFile(e.dataTransfer.files[0]);
  });

  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY) return;
    if (!e.newValue) return location.reload();
    try {
      const next = cleanState(JSON.parse(e.newValue));
      const mapChanged = next.map?.w !== state.map?.w || next.map?.h !== state.map?.h || next.map?.blank !== state.map?.blank;
      if (mapChanged) return location.reload();
      next.ui.view = state.ui.view;
      state = next;
      if (!selected()) selectedId = null;
      refresh();
      if (!ui.panel.contains(document.activeElement)) renderPanel();
    } catch { /* fremder Inhalt bleibt unbeachtet */ }
  });

  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  new ResizeObserver(() => {
    const cx = (vw / 2 - view.x) / view.k;
    const cy = (vh / 2 - view.y) / view.k;
    measure();
    setView(vw / 2 - cx * view.k, vh / 2 - cy * view.k, view.k);
  }).observe(ui.viewport);

  /* Start */

  document.querySelectorAll('[data-icon]').forEach(el => el.replaceWith(icon(el.dataset.icon)));

  (async () => {
    measure();
    if (!state.map) return showStart();
    if (state.map.blank) return enterMap(false);
    let stored = null;
    try {
      const blob = await fileStore(store => store.get('map'));
      if (blob) stored = { blob, probe: await probeImage(blob) };
    } catch { /* Hinweis erscheint auf der Startkarte */ }
    if (!stored) {
      state.map = null;
      return showStart();
    }
    showImage(stored.blob, stored.probe.url);
    state.map = { w: stored.probe.w, h: stored.probe.h, blank: false };
    enterMap(false);
  })();
})();
</script>
</body>
</html>
